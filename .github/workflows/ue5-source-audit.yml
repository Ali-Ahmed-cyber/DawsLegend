name: DAWS LEGEND UE5 source audit

on:
  push:
    branches: [ue5-clean-rebuild]
  pull_request:
    branches: [ue5-clean-rebuild]
  workflow_dispatch:

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unreal project descriptor
        run: python3 -m json.tool DAWSLegend.uproject > /dev/null
      - name: Verify required gameplay source files
        run: |
          test -f Source/DAWSLegend/DAWSLegend.Build.cs
          test -f Source/DAWSLegend/Private/DawsGameMode.cpp
          test -f Source/DAWSLegend/Private/DawsPlayerCharacter.cpp
          test -f Source/DAWSLegend/Private/DawsWorldBuilder.cpp
          test -f Source/DAWSLegend/Private/DawsEnemyCharacter.cpp
          test -f Source/DAWSLegend/Private/DawsMissionSubsystem.cpp
          test -f Source/DAWSLegend/Private/DawsSaveSubsystem.cpp
          test -f Source/DAWSLegend/Private/DawsHUD.cpp
          test -f Source/DAWSLegend/Private/DawsPickup.cpp
          test -f Source/DAWSLegend/Private/DawsPlayerController.cpp
          test -f Source/DAWSLegend/Private/DawsMissionTrigger.cpp
          test -f Source/DAWSLegend/Public/DawsPickup.h
          test -f Source/DAWSLegend/Public/DawsMissionSubsystem.h
          test -f Story/CAMPAIGN_PRODUCTION_SCRIPT.md
      - name: Ensure the UE5 branch has no old Godot project entry points
        run: |
          test ! -f project.godot
          test ! -f export_presets.cfg
          test ! -f .github/workflows/godot-check.yml

      - name: Audit campaign and gameplay wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          project = json.loads(Path("DAWSLegend.uproject").read_text())
          assert project["EngineAssociation"] == "5.4"
          source = Path("Source/DAWSLegend")
          mission = (source / "Private/DawsMissionSubsystem.cpp").read_text()
          game_mode = (source / "Private/DawsGameMode.cpp").read_text()
          player = (source / "Private/DawsPlayerCharacter.cpp").read_text()
          trigger = (source / "Private/DawsMissionTrigger.cpp").read_text()
          assert mission.count('TEXT("chapter') >= 30, "Campaign mission IDs are incomplete"
          assert "RestoreCampaignAtMission" in mission and "StartCampaignMission" in mission
          assert "SpawnActor<ADawsEnemyCharacter>" in game_mode
          assert "SpawnActor<ADawsPickup>" in game_mode
          controller = (source / "Private/DawsPlayerController.cpp").read_text()
          hud = (source / "Private/DawsHUD.cpp").read_text()
          assert "InteractWithWorld" in player and "FireWeapon" in player
          assert "StartGame" in controller and "PRESS ENTER TO BEGIN" in hud
          assert "CompleteObjective" in trigger and "GetInteractionPrompt_Implementation" in trigger
          print("Source integrity passed. This is not an Unreal C++ compile or in-engine test.")
          PY

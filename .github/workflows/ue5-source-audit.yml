name: DAWS LEGEND UE5 source audit

on:
  push:
    branches: [ue5-clean-rebuild]
  pull_request:
    branches: [ue5-clean-rebuild]
  workflow_dispatch:

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate campaign consistency and critical gameplay wiring
        run: python3 Scripts/validate_campaign.py
      - name: Validate Unreal project descriptor
        run: python3 -m json.tool DAWSLegend.uproject > /dev/null
      - name: Verify required gameplay source files
        run: |
          test -f Source/DAWSLegend/DAWSLegend.Build.cs
          test -f Source/DAWSLegend/Private/DawsGameMode.cpp
          test -f Source/DAWSLegend/Private/DawsPlayerCharacter.cpp
          test -f Source/DAWSLegend/Private/DawsWorldBuilder.cpp
          test -f Source/DAWSLegend/Private/DawsEnemyCharacter.cpp
          test -f Source/DAWSLegend/Private/DawsMissionSubsystem.cpp
          test -f Source/DAWSLegend/Private/DawsSaveSubsystem.cpp
          test -f Source/DAWSLegend/Private/DawsHUD.cpp
          test -f Source/DAWSLegend/Private/DawsPickup.cpp
          test -f Source/DAWSLegend/Private/DawsPlayerController.cpp
          test -f Source/DAWSLegend/Private/DawsStoryNPC.cpp
          test -f Source/DAWSLegend/Private/DawsVehiclePawn.cpp
          test -f Source/DAWSLegend/Private/DawsMissionTrigger.cpp
          test -f Source/DAWSLegend/Public/DawsPickup.h
          test -f Source/DAWSLegend/Public/DawsMissionSubsystem.h
          test -f Story/CAMPAIGN_PRODUCTION_SCRIPT.md
          grep -q 'Key=Gamepad_LeftY' Config/DefaultInput.ini
          grep -q 'Key=Gamepad_RightX' Config/DefaultInput.ini
      - name: Ensure the UE5 branch has no old Godot project entry points
        run: |
          test ! -f project.godot
          test ! -f export_presets.cfg
          test ! -f .github/workflows/godot-check.yml

      - name: Audit campaign and gameplay wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          project = json.loads(Path("DAWSLegend.uproject").read_text())
          assert project["EngineAssociation"] == "5.4"
          source = Path("Source/DAWSLegend")
          mission = (source / "Private/DawsMissionSubsystem.cpp").read_text()
          game_mode = (source / "Private/DawsGameMode.cpp").read_text()
          player = (source / "Private/DawsPlayerCharacter.cpp").read_text()
          trigger = (source / "Private/DawsMissionTrigger.cpp").read_text()
          assert mission.count('TEXT("chapter') >= 30, "Campaign mission IDs are incomplete"
          assert "RestoreCampaignAtMission" in mission and "StartCampaignMission" in mission
          world_builder = (source / "Private/DawsWorldBuilder.cpp").read_text()
          assert "AddPrimitive" in world_builder and "Street furniture" in world_builder
          assert "SpawnActor<ADawsEnemyCharacter>" in game_mode
          assert "SpawnActor<ADawsPickup>" in game_mode
          assert "SpawnActor<ADawsStoryNPC>" in game_mode
          assert "SpawnActor<ADawsVehiclePawn>" in game_mode
          vehicle = (source / "Private/DawsVehiclePawn.cpp").read_text()
          assert "ExitVehicle" in vehicle and "UFloatingPawnMovement" in vehicle
          controller = (source / "Private/DawsPlayerController.cpp").read_text()
          hud = (source / "Private/DawsHUD.cpp").read_text()
          assert "InteractWithWorld" in player and "FireWeapon" in player
          assert "BindAction(\"Jump\", IE_Pressed" in player and "StartJump" in player
          assert "StartGame" in controller and "ContinueGame" in controller and "F2 CONTINUE" in hud
          assert "RestartCampaign" in controller and "ResetForNewCampaign" in player
          assert "RestartCampaignWorld" in controller and "SpawnCampaignWorldActors" in (source / "Private/DawsGameMode.cpp").read_text()
          assert "StartNewCampaign" in controller and "DeleteSave" in controller
          assert "AdjustSettingRight" in controller and "MouseSensitivity" in controller
          assert "bSubtitlesEnabled" in controller and "Camera FOV" in hud
          pickup = (source / "Private/DawsPickup.cpp").read_text()
          story_npc = (source / "Private/DawsStoryNPC.cpp").read_text()
          assert "RegisterTaskProgress" in mission and "CanCompleteCurrentMission" in trigger
          assert 'GetCurrentTaskType() != TEXT("defeat")' in (source / "Private/DawsEnemyCharacter.cpp").read_text()
          assert "RegisterNPCInteraction" in mission and "RegisterNPCInteraction" in story_npc
          assert "chapter03_escort" in story_npc and "VInterpTo" in story_npc
          assert "BindAxis(\"Turn\", this, &ADawsVehiclePawn::TurnCamera)" in (source / "Private/DawsVehiclePawn.cpp").read_text()
          assert "SetCurrentDialogue" in (source / "Public/DawsMissionSubsystem.h").read_text()
          save_data = (source / "Public/DawsSaveGame.h").read_text()
          save_code = (source / "Private/DawsSaveSubsystem.cpp").read_text()
          assert "CurrentTaskProgress" in save_data and "MagazineAmmo" in save_data
          assert "ReserveAmmo" in save_code and "OnAmmoChanged.Broadcast" in save_code
          assert "RestoreTaskProgress" in player
          assert "EDawsPickupType::Supplies" in pickup and "EDawsPickupType::Evidence" in pickup
          assert "CompleteObjective" in trigger and "GetInteractionPrompt_Implementation" in trigger
          def delimiters_balanced(path):
              text = path.read_text()
              stack = []
              state = "code"
              pairs = {")": "(", "]": "[", "}": "{"}
              i = 0
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ""
                  if state == "code":
                      if ch == "/" and nxt == "/":
                          state = "line"
                          i += 2
                          continue
                      if ch == "/" and nxt == "*":
                          state = "block"
                          i += 2
                          continue
                      if ch == '"':
                          state = "string"
                      elif ch == "'":
                          state = "char"
                      elif ch in "([{":
                          stack.append(ch)
                      elif ch in ")]}":
                          if not stack or stack.pop() != pairs[ch]:
                              return False
                  elif state == "line":
                      if ch == "\n":
                          state = "code"
                  elif state == "block":
                      if ch == "*" and nxt == "/":
                          state = "code"
                          i += 2
                          continue
                  else:
                      if ch == "\\":
                          i += 2
                          continue
                      if (state == "string" and ch == '"') or (state == "char" and ch == "'"):
                          state = "code"
                  i += 1
              return not stack and state not in ("block", "string", "char")
          for path in list(source.rglob("*.cpp")) + list(source.rglob("*.h")):
              assert delimiters_balanced(path), f"Unbalanced C++ delimiters: {path}"
          print("Source integrity passed. This is not an Unreal C++ compile or in-engine test.")
          PY

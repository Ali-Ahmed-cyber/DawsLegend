name: Godot validation and Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate and import project
        run: godot --headless --editor --path . --quit
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/DAWS_LEGEND.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAWS-LEGEND-Android
          path: build/DAWS_LEGEND.apk
          if-no-files-found: error
